<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NomadDev · 随身开发平台</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#11161d; --line:#232b36; --txt:#dbe4ee; --sub:#8595a8;
    --ok:#3fb950; --bad:#f85149; --acc:#58a6ff; --warn:#d29922;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:24px 22px 32px}
  .wrap{max-width:1100px;margin:0 auto}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{width:34px;height:34px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;
    color:var(--acc);font:700 16px/1 Consolas,monospace;background:var(--panel)}
  h1{font-size:18px;font-weight:600}
  .head .sp{flex:1}
  .usb{font-size:12px;color:var(--sub)}
  .usb b{color:var(--txt);font-weight:600}
  .btn{font-family:inherit;font-size:12.5px;padding:5px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;
    background:var(--panel);color:var(--txt)}
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--line);color:var(--txt)}
  .btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .btn.primary:hover{filter:brightness(1.1);color:#fff}
  .btn.primary:disabled:hover{filter:none;color:#fff}

  .envbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 14px;border:1px solid var(--line);
    border-radius:8px;background:var(--panel);margin-bottom:14px;font-size:12.5px;color:var(--sub)}
  .chip{display:inline-flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
  .chip.bad{color:#f0b3b3}

  .sec{font-size:13px;font-weight:600;color:var(--sub);margin:20px 0 10px;letter-spacing:.5px}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 14px}
  .card .nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .tag{font-size:10px;color:var(--acc);border:1px solid var(--line);border-radius:4px;padding:0 5px}
  .card .meta{font-size:11.5px;color:var(--sub);margin:4px 0 8px;word-break:break-word;line-height:1.5}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .st{font-size:11.5px;color:var(--sub);margin:0 0 8px;word-break:break-word;line-height:1.6;min-height:16px}
  .st.ok{color:var(--ok)} .st.err{color:var(--bad)} .st.run{color:var(--acc)}
  .dlcard .meta{margin-bottom:6px}
  .dlcard .foot-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
  .empty{color:var(--sub);font-size:12.5px;padding:6px 2px}
  .foot{margin-top:28px;text-align:center;color:var(--sub);font-size:11.5px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2333;border:1px solid var(--line);
    padding:9px 18px;border-radius:7px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">&gt;_</div>
    <h1>NomadDev</h1>
    <div class="sp"></div>
    <div class="usb" id="usb">U盘：…</div>
    <button class="btn" id="refresh">刷新</button>
  </div>

  <div class="envbar"><span id="envchips">检测中…</span></div>

  <div class="sec">下载 / 安装环境</div>
  <div class="grid" id="dlsec"></div>

  <div class="sec">开发工具</div>
  <div class="grid" id="tools"></div>

  <div class="sec">本地项目</div>
  <div class="grid" id="projects"></div>

  <div class="sec">离线 AI</div>
  <div class="grid" id="ai"></div>

  <div class="sec">安装包</div>
  <div class="grid" id="installers"></div>

  <div class="foot">NomadDev · MIT · Python 标准库 · 无网亦可运行</div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])), enc=encodeURIComponent;
let dlTimer=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

async function scan(){
  try{
    const d=await (await fetch('/api/scan')).json();
    $('#usb').innerHTML='U盘：<b>'+esc(d.usb)+'</b>';
    renderEnv(d.env); renderCards('#tools',d.tools,t=>`<div class="nm">${esc(t.name)}</div><div class="meta">${esc(t.dir)}</div><div class="row"><button class="btn" onclick="openPath('${enc(t.path)}')">打开</button></div>`);
    renderCards('#projects',d.projects,p=>`<div class="nm">${esc(p.name)}${p.type==='web'?'<span class="tag">web</span>':''}</div><div class="meta">${esc(p.rel)}</div><div class="row">${p.type==='web'?`<button class="btn" onclick="serve('${enc(p.path)}',this)">起服务</button>`:''}<button class="btn" onclick="openPath('${enc(p.path)}')">打开</button></div>`);
    renderCards('#installers',d.installers,it=>`<div class="nm">${esc(it.name)}</div><div class="meta">${esc(it.dir)} · ${it.size_mb} MB</div><div class="row"><button class="btn" onclick="openPath('${enc(it.path)}')">运行</button></div>`);
    renderAI(d.ai);
  }catch(e){toast('扫描失败：'+e.message);}
}
function renderEnv(env){
  $('#envchips').innerHTML=env.map(e=>`<span class="chip ${e.ok?'':'bad'}"><span class="dot ${e.ok?'ok':'bad'}"></span>${esc(e.name)}</span>`).join('');
}
function renderCards(sel,list,fn){
  const el=$(sel);el.innerHTML='';
  if(!list.length){el.innerHTML='<div class="empty">（空）</div>';return;}
  list.forEach(x=>{const c=document.createElement('div');c.className='card';c.innerHTML=fn(x);el.appendChild(c);});
}
function renderAI(ai){
  const el=$('#ai');el.innerHTML='';
  if(!ai.found){el.innerHTML='<div class="empty">未检测到 Ollama（可选）</div>';return;}
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="nm">Ollama</div><div class="meta">${esc(ai.path)}</div>
    <div class="row"><button class="btn" id="aiBtn" onclick="aiToggle(this)">${ai.running?'停止':'启动'}</button>
    <button class="btn" onclick="openPath('${enc(ai.path)}')">打开</button></div>`;
  el.appendChild(c);window._aiRunning=ai.running;
}
async function aiToggle(btn){
  btn.disabled=true;
  const d=await (await fetch('/api/'+(window._aiRunning?'ai_stop':'ai_start'),{method:'POST'})).json();
  if(d.ok){window._aiRunning=!window._aiRunning;btn.textContent=window._aiRunning?'停止':'启动';toast(d.msg||'ok');}
  else toast('失败：'+(d.error||''));btn.disabled=false;
}
async function openPath(p){await fetch('/api/open?path='+enc(p),{method:'POST'});toast('已打开');}
async function serve(p,btn){
  btn.disabled=true;btn.textContent='启动中…';
  const d=await (await fetch('/api/serve?path='+enc(p),{method:'POST'})).json();
  if(d.url){window.open(d.url,'_blank');btn.textContent='运行中';toast('服务已启动：'+d.url);}
  else{btn.textContent='起服务';btn.disabled=false;toast('启动失败');}
}

// ---- 下载 / 安装环境 ----
async function loadDl(){
  try{
    const d=await (await fetch('/api/dl_list')).json();
    const el=$('#dlsec');el.innerHTML='';
    d.items.forEach(it=>{
      const stCls=it.state==='running'?'run':it.state==='ok'?'ok':it.state==='error'?'err':'';
      const c=document.createElement('div');c.className='card dlcard';
      const base=it.installed?'已安装':'未安装';
      const extra=it.state!=='idle'&&it.msg?(' · '+it.msg):'';
      const btnTxt=it.state==='running'?'安装中…':(it.installed?'重装':'安装');
      c.innerHTML=`<div class="nm">${esc(it.name)}</div>
        <div class="meta">${esc(it.size_mb)} · ${esc(it.note)}</div>
        <div class="st ${stCls}">${esc(base)}${esc(extra)}</div>
        <div class="foot-row"><button class="btn primary" onclick="startDl('${it.id}')" ${it.state==='running'?'disabled':''}>${btnTxt}</button></div>`;
      el.appendChild(c);
    });
    if(d.items.some(it=>it.state==='running')){clearTimeout(dlTimer);dlTimer=setTimeout(loadDl,1500);}
  }catch(e){toast('下载列表失败：'+e.message);}
}
async function startDl(id){
  const d=await (await fetch('/api/dl_start?pkg='+id,{method:'POST'})).json();
  if(d.ok){toast('开始安装…');loadDl();}else toast('失败：'+(d.error||''));
}
$('#refresh').onclick=()=>{scan();loadDl();toast('已刷新');};

scan();loadDl();
</script>
</body>
</html>
